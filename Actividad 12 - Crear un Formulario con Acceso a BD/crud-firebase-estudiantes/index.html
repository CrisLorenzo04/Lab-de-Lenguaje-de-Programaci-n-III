<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes - Firebase CRUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>🎓 Gestión de Estudiantes</h1>
        

        <div class="card">
            <h2>Registro de Estudiante</h2>
            <form id="studentForm">

                <input type="hidden" id="studentId">
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required placeholder="juan@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" required placeholder="809-555-1234">
                </div>

                <div class="form-group">
                    <label for="carrera">Carrera:</label>
                    <input type="text" id="carrera" required placeholder="Ej: Ingeniería de Software">
                </div>

                <div class="buttons">
                    <button type="submit" id="btnGuardar">💾 Guardar</button>
                    <button type="button" id="btnCancelar" style="display: none;">❌ Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Lista de Estudiantes</h2>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Carrera</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="studentsList">

                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
