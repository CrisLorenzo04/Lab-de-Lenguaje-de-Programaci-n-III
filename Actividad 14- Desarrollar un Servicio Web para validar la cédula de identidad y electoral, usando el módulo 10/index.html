<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cédula de Identidad Dominicana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { max-width: 500px; margin: 50px auto; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Validador de Cédula de Identidad Dominicana</h4>
            </div>
            <div class="card-body">
                <p class="text-muted text-center">Ingrese la cédula con o sin guiones.</p>
                
                <div class="mb-3">
                    <label for="cedulaInput" class="form-label">Ingrese el Número de Cédula a Consultar:</label>
                    <input type="text" id="cedulaInput" class="form-control form-control-lg text-center" 
                           placeholder="001-0000000-0" maxlength="13">
                </div>
                
                <button onclick="validarCedula()" class="btn btn-primary w-100 btn-lg">Validar Cédula</button>

                <div id="resultado" class="mt-3 d-none"></div>
            </div>
            <div class="card-footer text-center text-muted small">
                Desarrollado por Cristian Lorenzo
            </div>
        </div>
    </div>

    <script>
        function validarCedula() {
            let cedula = document.getElementById('cedulaInput').value;
            let cedulaLimpia = cedula.replace(/-/g, '').replace(/\s/g, '');

            const divResultado = document.getElementById('resultado');

            if (cedulaLimpia.length !== 11 || isNaN(cedulaLimpia)) {
                mostrarMensaje('Por favor, ingrese una cédula válida de 11 dígitos.', 'warning');
                return;
            }

            let suma = 0;
            let multiplicador = 1; 

            for (let i = 0; i < 10; i++) {
                let digito = parseInt(cedulaLimpia.charAt(i));
                let producto = digito * multiplicador;

                if (producto > 9) {
                    producto = producto.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }

                suma += producto;
                
                multiplicador = multiplicador === 1 ? 2 : 1;
            }

            let residuo = suma % 10;
            let digitoVerificadorCalculado = residuo === 0 ? 0 : 10 - residuo;

            let digitoVerificadorReal = parseInt(cedulaLimpia.charAt(10));

            if (digitoVerificadorCalculado === digitoVerificadorReal) {
                mostrarMensaje('¡La cédula es VÁLIDA!', 'success');
            } else {
                mostrarMensaje('La cédula es INVÁLIDA.', 'danger');
            }
        }

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('resultado');
            div.className = `alert alert-${tipo} mt-3`;
            div.innerText = texto;
            div.classList.remove('d-none');
        }

        document.getElementById('cedulaInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                validarCedula();
            }
        });
    </script>
</body>
</html>
